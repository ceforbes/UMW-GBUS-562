<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Four</title>
<style>
  :root {
    --bg: #f3f4f8;
    --surface: #ffffff;
    --text: #1d2233;
    --muted: #6b7286;
    --line: #e2e5ee;
    --board: #2f5be0;
    --board-hi: #4370f0;
    --slot: #dfe5f5;
    --p1: #ef4b5b;
    --p1-hi: #ff8a94;
    --p1-lo: #b92738;
    --p2: #f7b928;
    --p2-hi: #ffdc7a;
    --p2-lo: #c98a07;
    --shadow: 0 18px 40px -18px rgba(30, 50, 120, .45);
    --pad: clamp(8px, 2.4vw, 14px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1220;
      --surface: #181c2e;
      --text: #e9ecf5;
      --muted: #9097ad;
      --line: #272c42;
      --board: #2a4fc4;
      --board-hi: #3a62d8;
      --slot: #0b0e19;
      --shadow: 0 18px 40px -16px rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1220;
    --surface: #181c2e;
    --text: #e9ecf5;
    --muted: #9097ad;
    --line: #272c42;
    --board: #2a4fc4;
    --board-hi: #3a62d8;
    --slot: #0b0e19;
    --shadow: 0 18px 40px -16px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  .app {
    width: 100%;
    max-width: 560px;
    padding: 24px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header { text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(28px, 7vw, 38px);
    letter-spacing: -.02em;
    font-weight: 800;
  }
  h1 .a { color: var(--p1); }
  h1 .b { color: var(--p2); }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  /* Scoreboard */
  .scores {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
  }
  .score {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--muted);
  }
  .score strong {
    margin-left: auto;
    font-size: 22px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .score.draw { justify-content: center; gap: 10px; }
  .score.draw strong { margin-left: 0; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%; flex: none;
  }
  .dot.p1 { background: radial-gradient(circle at 35% 30%, var(--p1-hi), var(--p1) 60%, var(--p1-lo)); }
  .dot.p2 { background: radial-gradient(circle at 35% 30%, var(--p2-hi), var(--p2) 60%, var(--p2-lo)); }

  /* Status line */
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 40px;
    font-weight: 650;
    font-size: 17px;
    border-radius: 999px;
    transition: background-color .25s, color .25s;
  }
  .status[data-state="win"] { background: color-mix(in srgb, var(--p1) 16%, transparent); }
  .status[data-state="lose"] { background: color-mix(in srgb, var(--p2) 22%, transparent); }
  .status[data-state="draw"] { background: var(--line); }
  .thinking::after {
    content: "";
    display: inline-block;
    width: 1.2em;
    text-align: left;
    animation: dots 1.2s steps(4) infinite;
  }
  @keyframes dots {
    0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; }
  }

  /* Board */
  .game { display: flex; flex-direction: column; }
  .preview {
    position: relative;
    margin: 0 var(--pad);
    aspect-ratio: 7 / 1;
  }
  .ghost {
    position: absolute;
    top: 0;
    width: calc(100% / 7);
    height: 100%;
    left: calc(var(--c, 3) * 100% / 7);
    transition: left .14s ease, opacity .2s;
    opacity: 0;
  }
  .ghost.show { opacity: 1; }
  .ghost::before {
    content: "";
    position: absolute;
    inset: 12%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--p1-hi), var(--p1) 58%, var(--p1-lo));
    animation: hover 1.6s ease-in-out infinite;
  }
  @keyframes hover {
    0%, 100% { transform: translateY(-3%); }
    50% { transform: translateY(5%); }
  }

  .board-wrap {
    background: linear-gradient(180deg, var(--board-hi), var(--board));
    padding: var(--pad);
    border-radius: 22px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .18);
  }
  .board-wrap.shake { animation: shake .3s; }
  @keyframes shake {
    20%, 60% { transform: translateX(-5px); }
    40%, 80% { transform: translateX(5px); }
  }
  .board {
    position: relative;
    aspect-ratio: 7 / 6;
    background: var(--slot);
    overflow: hidden;
  }
  .discs, .frame, .cols { position: absolute; inset: 0; }
  .frame {
    background-color: var(--board);
    background-image: radial-gradient(circle closest-side, rgba(0, 0, 0, .3) 84%, transparent 97%);
    background-size: calc(100% / 7) calc(100% / 6);
    -webkit-mask-image: radial-gradient(circle closest-side, transparent 85%, #000 87%);
    mask-image: radial-gradient(circle closest-side, transparent 85%, #000 87%);
    -webkit-mask-size: calc(100% / 7) calc(100% / 6);
    mask-size: calc(100% / 7) calc(100% / 6);
    pointer-events: none;
  }
  .cols { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cols button {
    border: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    transition: background-color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .cols button:focus { outline: none; }
  .cols button.active { background: rgba(255, 255, 255, .08); }
  .locked .cols button { cursor: default; }
  .locked .cols button.active { background: transparent; }

  .disc {
    position: absolute;
    width: calc(100% / 7);
    height: calc(100% / 6);
    left: calc(var(--c) * 100% / 7);
    top: calc(var(--r) * 100% / 6);
    animation: drop var(--dur) both;
    transition: opacity .35s;
  }
  .disc::before {
    content: "";
    position: absolute;
    inset: 9%;
    border-radius: 50%;
    box-shadow: inset 0 0 0 calc(var(--cell, 60px) * .05) rgba(0, 0, 0, .12),
                inset 0 -3px 6px rgba(0, 0, 0, .18);
  }
  .disc.p1::before { background: radial-gradient(circle at 35% 30%, var(--p1-hi), var(--p1) 58%, var(--p1-lo)); }
  .disc.p2::before { background: radial-gradient(circle at 35% 30%, var(--p2-hi), var(--p2) 58%, var(--p2-lo)); }
  .disc.last::after {
    content: "";
    position: absolute;
    inset: 44%;
    border-radius: 50%;
    background: rgba(255, 255, 255, .75);
  }
  @keyframes drop {
    0% { transform: translateY(calc(var(--fall) * -100%)); animation-timing-function: cubic-bezier(.5, 0, 1, 1); }
    74% { transform: translateY(0); animation-timing-function: ease-out; }
    87% { transform: translateY(-9%); animation-timing-function: ease-in; }
    100% { transform: translateY(0); }
  }
  .discs.has-win .disc:not(.win) { opacity: .35; }
  .disc.win::before { animation: pulse 1.1s ease-in-out infinite; }
  .disc.win::after { display: none; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(.88); filter: brightness(1.2); }
  }

  /* Controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
  }
  .seg {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 3px;
  }
  .seg button {
    border: 0;
    background: transparent;
    padding: 8px 14px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .seg button[aria-checked="true"] { background: var(--text); color: var(--surface); }
  .actions { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 9px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
    transition: transform .1s, opacity .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.primary { background: var(--board); border-color: var(--board); color: #fff; }
  .btn.primary.nudge { animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--board) 50%, transparent); }
    50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--board) 0%, transparent); }
  }

  .foot {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: 12.5px;
  }
  .link {
    border: 0; background: none; padding: 0;
    color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12.5px;
  }

  @media (max-width: 420px) {
    .controls { justify-content: center; }
    .score { padding: 8px 10px; font-size: 13px; }
    .score strong { font-size: 19px; }
    .foot .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .disc { animation-duration: 1ms !important; }
    .ghost::before, .disc.win::before, .btn.primary.nudge { animation: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Connect <span class="a">Fo</span><span class="b">ur</span></h1>
    <p class="sub">Line up four in a row — across, down, or diagonally.</p>
  </header>

  <section class="scores" aria-label="Score">
    <div class="score"><span class="dot p1"></span>You<strong id="scoreYou">0</strong></div>
    <div class="score draw">Draws<strong id="scoreDraw">0</strong></div>
    <div class="score"><span class="dot p2"></span>Computer<strong id="scoreCpu">0</strong></div>
  </section>

  <div class="status" id="status" aria-live="polite">
    <span class="dot" id="statusDot"></span><span id="statusText"></span>
  </div>

  <div class="game">
    <div class="preview" aria-hidden="true"><div class="ghost" id="ghost"></div></div>
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board">
        <div class="discs" id="discs"></div>
        <div class="frame"></div>
        <div class="cols" id="cols"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="seg" role="radiogroup" aria-label="Difficulty" id="difficulty">
      <button role="radio" data-level="easy">Easy</button>
      <button role="radio" data-level="medium">Medium</button>
      <button role="radio" data-level="hard">Hard</button>
    </div>
    <div class="actions">
      <button class="btn" id="undo">Undo</button>
      <button class="btn primary" id="newGame">New game</button>
    </div>
  </div>

  <div class="foot">
    <span class="keys">← → to aim · Enter to drop · 1–7 for a column</span>
    <button class="link" id="resetScore">Reset score</button>
  </div>
</main>

<script>
(() => {
  const ROWS = 6, COLS = 7, HUMAN = 1, CPU = 2;
  const WIN = 1e6;
  const DEPTH = { easy: 2, medium: 4, hard: 8 };
  const ORDER = [3, 2, 4, 1, 5, 0, 6]; // center-first search order

  // Every possible line of four, as flat board indices.
  const WINDOWS = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
        const er = r + dr * 3, ec = c + dc * 3;
        if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
        WINDOWS.push([0, 1, 2, 3].map(i => (r + dr * i) * COLS + (c + dc * i)));
      }
    }
  }

  const $ = id => document.getElementById(id);
  const els = {
    discs: $('discs'), cols: $('cols'), ghost: $('ghost'), wrap: $('boardWrap'), board: $('board'),
    status: $('status'), statusText: $('statusText'), statusDot: $('statusDot'),
    undo: $('undo'), newGame: $('newGame'), difficulty: $('difficulty'),
    scoreYou: $('scoreYou'), scoreDraw: $('scoreDraw'), scoreCpu: $('scoreCpu'),
  };

  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem('c4.' + key); return v === null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem('c4.' + key, JSON.stringify(value)); } catch {}
    },
  };

  let board, history, turn, over, busy, gameId = 0;
  let cursor = 3, pointerInside = false, keyboardAim = false;
  let nextStarter = HUMAN;
  let difficulty = store.get('difficulty', 'medium');
  let scores = store.get('scores', { you: 0, cpu: 0, draw: 0 });
  if (!(difficulty in DEPTH)) difficulty = 'medium';

  const sleep = ms => new Promise(res => setTimeout(res, ms));

  // ---------- Board logic ----------

  function dropRow(b, c) {
    for (let r = ROWS - 1; r >= 0; r--) if (!b[r * COLS + c]) return r;
    return -1;
  }

  function winLine(b, r, c, p) {
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const line = [[r, c]];
      for (const s of [1, -1]) {
        let rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && b[rr * COLS + cc] === p) {
          line.push([rr, cc]);
          rr += dr * s; cc += dc * s;
        }
      }
      if (line.length >= 4) return line;
    }
    return null;
  }

  // ---------- AI: negamax with alpha-beta ----------

  // Static score of the position from `p`'s point of view.
  function evaluate(b, p) {
    const o = 3 - p;
    let score = 0;
    for (let r = 0; r < ROWS; r++) {
      const v = b[r * COLS + 3];
      if (v === p) score += 3; else if (v === o) score -= 3;
    }
    for (const w of WINDOWS) {
      let mine = 0, theirs = 0;
      for (let i = 0; i < 4; i++) {
        const v = b[w[i]];
        if (v === p) mine++; else if (v === o) theirs++;
      }
      if (mine && theirs) continue;
      if (mine === 3) score += 6;
      else if (mine === 2) score += 2;
      else if (theirs === 3) score -= 5;
      else if (theirs === 2) score -= 2;
    }
    return score;
  }

  function negamax(b, depth, alpha, beta, p) {
    const moves = ORDER.filter(c => !b[c]);
    if (!moves.length) return 0;
    // Win available right now? Take it (faster wins score higher).
    for (const c of moves) {
      const i = dropRow(b, c) * COLS + c;
      b[i] = p;
      const won = winLine(b, (i / COLS) | 0, c, p);
      b[i] = 0;
      if (won) return WIN + depth;
    }
    if (depth === 0) return evaluate(b, p);
    let best = -Infinity;
    for (const c of moves) {
      const i = dropRow(b, c) * COLS + c;
      b[i] = p;
      const s = -negamax(b, depth - 1, -beta, -alpha, 3 - p);
      b[i] = 0;
      if (s > best) best = s;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }

  function chooseMove() {
    const b = board.slice();
    const depth = DEPTH[difficulty];
    const scored = [];
    for (const c of ORDER) {
      const r = dropRow(b, c);
      if (r < 0) continue;
      const i = r * COLS + c;
      b[i] = CPU;
      if (winLine(b, r, c, CPU)) return c;
      // Full window at the root so every move gets a real score to choose between.
      const s = -negamax(b, depth - 1, -Infinity, Infinity, HUMAN);
      b[i] = 0;
      scored.push({ c, s });
    }
    scored.sort((a, b) => b.s - a.s);
    const best = scored[0].s;
    const safe = scored.filter(m => m.s > -WIN / 2);

    // Easy: often settles for any move that doesn't lose on the spot.
    if (difficulty === 'easy' && safe.length > 1 && Math.random() < 0.4) {
      return safe[Math.floor(Math.random() * safe.length)].c;
    }
    // Medium: occasionally takes a close second.
    if (difficulty === 'medium' && Math.random() < 0.15) {
      const close = safe.filter(m => m.s >= best - 6);
      if (close.length > 1) return close[Math.floor(Math.random() * close.length)].c;
    }
    const top = scored.filter(m => m.s === best);
    return top[Math.floor(Math.random() * top.length)].c;
  }

  // ---------- Rendering ----------

  function addDisc(r, c, p) {
    const prev = els.discs.querySelector('.last');
    if (prev) prev.classList.remove('last');
    const d = document.createElement('div');
    const dur = 230 + (r + 1) * 55;
    d.className = `disc p${p} last`;
    d.id = `d-${r}-${c}`;
    d.style.setProperty('--r', r);
    d.style.setProperty('--c', c);
    d.style.setProperty('--fall', r + 1);
    d.style.setProperty('--dur', dur + 'ms');
    els.discs.appendChild(d);
    return dur;
  }

  function setStatus(text, state, dotPlayer, thinking = false) {
    els.statusText.textContent = text;
    els.statusText.classList.toggle('thinking', thinking);
    els.status.dataset.state = state || '';
    els.statusDot.className = dotPlayer ? `dot p${dotPlayer}` : 'dot';
    els.statusDot.style.display = dotPlayer ? '' : 'none';
  }

  function render() {
    const humanTurn = !over && !busy && turn === HUMAN;
    els.board.classList.toggle('locked', !humanTurn);
    els.ghost.style.setProperty('--c', cursor);
    els.ghost.classList.toggle('show', humanTurn && (pointerInside || keyboardAim));
    [...els.cols.children].forEach((btn, c) => {
      btn.classList.toggle('active', humanTurn && (pointerInside || keyboardAim) && c === cursor);
    });
    els.undo.disabled = busy || over || !history.some(m => m.p === HUMAN);
    els.newGame.classList.toggle('nudge', over);
    els.scoreYou.textContent = scores.you;
    els.scoreCpu.textContent = scores.cpu;
    els.scoreDraw.textContent = scores.draw;
    [...els.difficulty.children].forEach(btn => {
      btn.setAttribute('aria-checked', String(btn.dataset.level === difficulty));
    });
  }

  // ---------- Game flow ----------

  function newGame() {
    gameId++;
    board = new Int8Array(ROWS * COLS);
    history = [];
    over = false;
    busy = false;
    els.discs.innerHTML = '';
    els.discs.classList.remove('has-win');
    turn = nextStarter;
    nextStarter = 3 - nextStarter;
    if (turn === HUMAN) {
      setStatus('Your move', '', HUMAN);
      render();
    } else {
      cpuTurn(gameId);
    }
  }

  function finish(winner, line) {
    over = true;
    if (winner === HUMAN) { scores.you++; setStatus('You win — nicely played!', 'win', HUMAN); }
    else if (winner === CPU) { scores.cpu++; setStatus('The computer wins this one', 'lose', CPU); }
    else { scores.draw++; setStatus("It's a draw — board's full", 'draw', 0); }
    store.set('scores', scores);
    if (line) {
      els.discs.classList.add('has-win');
      for (const [r, c] of line) $(`d-${r}-${c}`).classList.add('win');
    }
  }

  // Places a disc, waits for the drop animation, then checks for game end.
  async function place(c, p, id) {
    const r = dropRow(board, c);
    board[r * COLS + c] = p;
    history.push({ r, c, p });
    await sleep(addDisc(r, c, p));
    if (id !== gameId) return false;
    const line = winLine(board, r, c, p);
    if (line) finish(p, line);
    else if (history.length === ROWS * COLS) finish(0);
    return true;
  }

  async function humanPlay(c) {
    if (busy || over || turn !== HUMAN) return;
    if (dropRow(board, c) < 0) {
      els.wrap.classList.remove('shake');
      void els.wrap.offsetWidth;
      els.wrap.classList.add('shake');
      return;
    }
    const id = gameId;
    busy = true;
    render();
    if (!(await place(c, HUMAN, id))) return;
    if (over) { busy = false; render(); return; }
    await cpuTurn(id);
  }

  async function cpuTurn(id) {
    busy = true;
    turn = CPU;
    setStatus('Computer is thinking', '', CPU, true);
    render();
    await sleep(380 + Math.random() * 250);
    if (id !== gameId) return;
    const c = chooseMove();
    if (!(await place(c, CPU, id))) return;
    busy = false;
    if (!over) {
      turn = HUMAN;
      setStatus('Your move', '', HUMAN);
    }
    render();
  }

  function undo() {
    if (busy || over) return;
    while (history.length) {
      const m = history.pop();
      board[m.r * COLS + m.c] = 0;
      $(`d-${m.r}-${m.c}`).remove();
      if (m.p === HUMAN) break;
    }
    const last = history[history.length - 1];
    if (last) $(`d-${last.r}-${last.c}`).classList.add('last');
    turn = HUMAN;
    setStatus('Your move', '', HUMAN);
    render();
  }

  // ---------- Input ----------

  for (let c = 0; c < COLS; c++) {
    const btn = document.createElement('button');
    btn.setAttribute('aria-label', `Drop in column ${c + 1}`);
    btn.addEventListener('pointerenter', () => { cursor = c; pointerInside = true; keyboardAim = false; render(); });
    btn.addEventListener('click', () => { cursor = c; humanPlay(c); });
    els.cols.appendChild(btn);
  }
  els.cols.addEventListener('pointerleave', () => { pointerInside = false; render(); });

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      cursor = Math.max(0, Math.min(COLS - 1, cursor + (e.key === 'ArrowLeft' ? -1 : 1)));
      keyboardAim = true;
      render();
      e.preventDefault();
    } else if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') {
      if (document.activeElement && document.activeElement.closest('.controls, .foot')) return;
      keyboardAim = true;
      humanPlay(cursor);
      e.preventDefault();
    } else if (/^[1-7]$/.test(e.key)) {
      cursor = Number(e.key) - 1;
      humanPlay(cursor);
    } else if (e.key === 'n' || e.key === 'N') {
      newGame();
    }
  });

  els.difficulty.addEventListener('click', e => {
    const level = e.target.dataset && e.target.dataset.level;
    if (!level) return;
    difficulty = level;
    store.set('difficulty', level);
    render();
  });
  els.undo.addEventListener('click', undo);
  els.newGame.addEventListener('click', newGame);
  $('resetScore').addEventListener('click', () => {
    scores = { you: 0, cpu: 0, draw: 0 };
    store.set('scores', scores);
    render();
  });

  newGame();
})();
</script>
</body>
</html>
